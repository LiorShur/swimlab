[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swimlab"
version = "0.1.0"
description = "Offline analysis pipeline for a head-mounted IMU pilot study on recreational swimmers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "polars>=0.20",
    "numpy>=1.26",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    # Reference implementations used only to cross-check swimlab.stats in the
    # test-suite (tests/test_stats.py). The shipped stats module depends only
    # on numpy/scipy and must not import these.
    "diptest>=0.7",       # reference Hartigan dip statistic
    "scikit-learn>=1.3",  # reference Cohen kappa and ROC AUC
    "pingouin>=0.5",      # reference ICC(2,1) point estimate and CI
]

[tool.setuptools.packages.find]
include = ["swimlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
